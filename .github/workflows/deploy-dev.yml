name: Deploy to Dev

on:
  push:
    branches:
      - dev.chaothuk

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CHAOTHUK_DEV_SSH_HOST }}
          username: ${{ secrets.CHAOTHUK_DEV_SSH_USERNAME }}
          key: ${{ secrets.CHAOTHUK_DEV_SSH_KEY }}
          port: ${{ secrets.CHAOTHUK_DEV_SSH_PORT }}
          script: |
            set -euo pipefail

            APP_DIR="/var/www/html/chaothuk-dev"
            BRANCH="dev.chaothuk"
            PHP_PATH="/usr/bin/php8.5"
            COMPOSER_PATH="composer.phar"

            cd "$APP_DIR"

            git config --global --get-all safe.directory | grep -qx "$APP_DIR" \
              || git config --global --add safe.directory "$APP_DIR"

            git fetch origin
            git reset --hard "origin/$BRANCH"

            $PHP_PATH $COMPOSER_PATH install --no-interaction --prefer-dist --optimize-autoloader

            npm install
            npm run build

            $PHP_PATH artisan migrate --force

            $PHP_PATH artisan config:cache
            $PHP_PATH artisan route:cache
            $PHP_PATH artisan view:cache

            chown -R www-data:www-data storage bootstrap/cache

            for d in storage/logs bootstrap/cache; do
              owner=$(stat -c '%U' "$d")
              if [ "$owner" != "www-data" ]; then
                echo "::error::$d is owned by $owner — php-fpm (www-data) cannot write to it"
                exit 1
              fi
            done

            echo "✅ Dev deployment completed successfully! → $(git rev-parse --short HEAD)"
